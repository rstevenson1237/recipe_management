<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Inlined by Code.gs's openRecipeApp() so the form has Helper Data the instant
    // it renders, instead of waiting on a google.script.run round trip after load.
    window.__HELPER_DATA__ = <?!= helperDataJson ?>;
  </script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    [data-title]:hover::after {
      content: attr(data-title);
      position: absolute;
      bottom: 100%;
      left: 0;
      background: #1e293b;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      width: max-content;
      max-width: 250px;
      z-index: 10;
      margin-bottom: 5px;
    }
    .tooltip-container { position: relative; display: inline-block; }
    .field-error { border-color: #dc2626 !important; background-color: #fef2f2; }
    .drag-over { outline: 2px dashed #f97316; outline-offset: 2px; }
  </style>
</head>
<body class="bg-gray-100">

<div id="app" class="h-screen flex flex-col">

  <!-- Loading / error states -->
  <div v-if="loadingHelperData" class="flex-1 flex items-center justify-center text-gray-500">
    Loading recipe data...
  </div>
  <div v-else-if="helperDataError" class="flex-1 flex flex-col items-center justify-center text-center gap-3 p-8">
    <p class="text-red-600 font-medium">{{ helperDataError }}</p>
    <button @click="loadHelperData" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Retry</button>
  </div>

  <!-- Main form -->
  <template v-else>
    <div class="flex-1 overflow-y-auto p-4 sm:p-6">
      <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-4 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-6 border-b pb-4">Create New Recipe</h1>

        <!-- SECTION 1: IDENTIFICATION -->
        <div class="mb-6">
          <div class="bg-blue-600 text-white px-4 py-2 rounded-t-lg font-bold">1. Recipe Identification</div>
          <div class="border border-blue-600 p-4 rounded-b-lg grid grid-cols-1 sm:grid-cols-2 gap-6 bg-blue-50">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="The name used to refer to the recipe for prep and menu use">Recipe Name ⓘ</label>
              <input type="text" v-model="form.name" @input="touch('name')" @blur="touch('name')"
                     class="w-full border-gray-300 rounded-md shadow-sm p-2 border" :class="{'field-error': fieldError('name')}">
              <p v-if="fieldError('name')" class="text-xs text-red-600 mt-1">{{ fieldError('name') }}</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="Select Weight, Volume or Each. This determines the yield constraints.">Measure Type ⓘ</label>
              <select v-model="form.measureType" @change="touch('measureType')"
                      class="w-full border-gray-300 rounded-md shadow-sm p-2 border" :class="{'field-error': fieldError('measureType')}">
                <option value="" disabled>Select Type...</option>
                <option value="Weight">Weight</option>
                <option value="Volume">Volume</option>
                <option value="Each">Each</option>
              </select>
              <p v-if="fieldError('measureType')" class="text-xs text-red-600 mt-1">{{ fieldError('measureType') }}</p>
            </div>
          </div>
        </div>

        <!-- SECTION 2: YIELD OUTPUT -->
        <div class="mb-6">
          <div class="bg-green-600 text-white px-4 py-2 rounded-t-lg font-bold">2. Yield Output</div>
          <div class="border border-green-600 p-4 rounded-b-lg grid grid-cols-1 sm:grid-cols-2 gap-6 bg-green-50">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="The total yielded amount or number of servings the recipe produces.">Yield Qty ⓘ</label>
              <input type="number" v-model="form.yieldQty" @input="touch('yieldQty')" @blur="touch('yieldQty')"
                     class="w-full border-gray-300 rounded-md shadow-sm p-2 border" :class="{'field-error': fieldError('yieldQty')}">
              <p v-if="fieldError('yieldQty')" class="text-xs text-red-600 mt-1">{{ fieldError('yieldQty') }}</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="Constrained by Measure Type. Also used as the Reporting U of M.">Yield U of M ⓘ</label>
              <select v-model="form.yieldUom" @change="touch('yieldUom')" :disabled="!form.measureType"
                      class="w-full border-gray-300 rounded-md shadow-sm p-2 border disabled:bg-gray-200" :class="{'field-error': fieldError('yieldUom')}">
                <option value="" disabled>Select Yield UOM...</option>
                <option v-for="uom in availableYieldUoms" :key="uom" :value="uom">{{ uom }}</option>
              </select>
              <p v-if="fieldError('yieldUom')" class="text-xs text-red-600 mt-1">{{ fieldError('yieldUom') }}</p>
            </div>
          </div>
        </div>

        <!-- SECTION 3: PORTION & USAGE -->
        <div class="mb-6">
          <div class="bg-purple-600 text-white px-4 py-2 rounded-t-lg font-bold">3. Portion &amp; Usage</div>
          <div class="border border-purple-600 p-4 rounded-b-lg bg-purple-50">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Portion Size</label>
                <input type="number" v-model="form.portionSize" @input="touch('portionSize')" @blur="touch('portionSize')"
                       class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Portion U of M</label>
                <select v-model="form.portionUom" @change="touch('portionUom')"
                        class="w-full border-gray-300 rounded-md shadow-sm p-2 border" :class="{'field-error': fieldError('portionUom')}">
                  <option value=""></option>
                  <optgroup label="Weight"><option v-for="uom in uomData.Weight" :key="uom">{{ uom }}</option></optgroup>
                  <optgroup label="Volume"><option v-for="uom in uomData.Volume" :key="uom">{{ uom }}</option></optgroup>
                  <optgroup label="Each"><option v-for="uom in uomData.Each" :key="uom">{{ uom }}</option></optgroup>
                </select>
                <p v-if="fieldError('portionUom')" class="text-xs text-red-600 mt-1">{{ fieldError('portionUom') }}</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">In Inventory?</label>
                <select v-model="form.inventoryYesNo" @change="touch('inventoryYesNo')"
                        class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
                  <option value="Yes">Yes</option><option value="No">No</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Inventory U of M</label>
                <select v-model="form.inventoryUom" @change="touch('inventoryUom')" :disabled="form.inventoryYesNo === 'No'"
                        class="w-full border-gray-300 rounded-md shadow-sm p-2 border disabled:bg-gray-200" :class="{'field-error': fieldError('inventoryUom')}">
                  <option value=""></option>
                  <optgroup label="Weight"><option v-for="uom in uomData.Weight" :key="uom">{{ uom }}</option></optgroup>
                  <optgroup label="Volume"><option v-for="uom in uomData.Volume" :key="uom">{{ uom }}</option></optgroup>
                  <optgroup label="Each"><option v-for="uom in uomData.Each" :key="uom">{{ uom }}</option></optgroup>
                </select>
                <p v-if="fieldError('inventoryUom')" class="text-xs text-red-600 mt-1">{{ fieldError('inventoryUom') }}</p>
              </div>
            </div>

            <!-- Equivalency Block -->
            <div v-if="needsEquivalency" class="bg-yellow-100 border-l-4 border-yellow-500 p-4 mt-4 rounded">
              <h3 class="font-bold text-yellow-800 mb-2">⚠️ Equivalency Required</h3>
              <p class="text-sm text-yellow-700 mb-4">Define how Weight, Volume and Each convert to each other for this recipe. Yield and the conflicting Portion/Inventory U of M are prefilled - only the highlighted U of M needs entry, but you may adjust any of them.</p>
              <div class="flex flex-wrap items-center gap-4">
                <div>
                  <div class="text-xs font-medium text-gray-500 mb-1">Weight</div>
                  <div class="flex space-x-2">
                    <input type="number" v-model="form.weightQty" @input="touchEquiv('Weight')" placeholder="Qty" class="w-20 p-2 border rounded" :class="{'field-error': fieldError('weightEquivalency')}">
                    <select v-model="form.weightUom" @change="touchEquiv('Weight')" class="p-2 border rounded" :class="{'field-error': fieldError('weightEquivalency')}">
                      <option value=""></option>
                      <option v-for="uom in uomData.Weight" :key="uom">{{ uom }}</option>
                    </select>
                  </div>
                </div>
                <span class="font-bold text-gray-500">=</span>
                <div>
                  <div class="text-xs font-medium text-gray-500 mb-1">Volume</div>
                  <div class="flex space-x-2">
                    <input type="number" v-model="form.volumeQty" @input="touchEquiv('Volume')" placeholder="Qty" class="w-20 p-2 border rounded" :class="{'field-error': fieldError('volumeEquivalency')}">
                    <select v-model="form.volumeUom" @change="touchEquiv('Volume')" class="p-2 border rounded" :class="{'field-error': fieldError('volumeEquivalency')}">
                      <option value=""></option>
                      <option v-for="uom in uomData.Volume" :key="uom">{{ uom }}</option>
                    </select>
                  </div>
                </div>
                <span class="font-bold text-gray-500">=</span>
                <div>
                  <div class="text-xs font-medium text-gray-500 mb-1">Each</div>
                  <div class="flex space-x-2">
                    <input type="number" v-model="form.eachQty" @input="touchEquiv('Each')" placeholder="Qty" class="w-20 p-2 border rounded" :class="{'field-error': fieldError('eachEquivalency')}">
                    <select v-model="form.eachUom" @change="touchEquiv('Each')" class="p-2 border rounded" :class="{'field-error': fieldError('eachEquivalency')}">
                      <option value=""></option>
                      <option v-for="uom in uomData.Each" :key="uom">{{ uom }}</option>
                    </select>
                  </div>
                </div>
              </div>
              <p v-if="fieldError('weightEquivalency') || fieldError('volumeEquivalency') || fieldError('eachEquivalency')" class="text-xs text-red-700 mt-2">
                {{ fieldError('weightEquivalency') || fieldError('volumeEquivalency') || fieldError('eachEquivalency') }}
              </p>
            </div>
          </div>
        </div>

        <!-- SECTION 4: INGREDIENTS & BULK PASTE -->
        <div class="mb-6">
          <div class="flex justify-between items-end bg-orange-600 text-white px-4 py-2 rounded-t-lg font-bold">
            <span>4. Ingredients List</span>
            <button @click="showBulk = !showBulk" class="text-xs bg-orange-800 hover:bg-orange-900 px-3 py-1 rounded">
              {{ showBulk ? 'Hide Bulk Paste' : 'Use Bulk Paste' }}
            </button>
          </div>
          <div class="border border-orange-600 p-4 rounded-b-lg bg-orange-50">

            <!-- Bulk Paste Tool -->
            <div v-if="showBulk" class="mb-6 bg-white p-4 border border-orange-300 rounded shadow-inner">
              <label class="block text-sm font-medium text-gray-700 mb-2">Bulk Paste from Excel (Ingredient | Qty | UOM)</label>
              <textarea v-model="bulkText" rows="4" class="w-full border-gray-300 rounded-md shadow-sm p-2 border font-mono text-sm mb-2" placeholder="Paste your Excel grid here..."></textarea>
              <button @click="parseBulkData" class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700">Parse Data</button>
              <p class="text-xs text-gray-500 mt-2">Rows that don't match Helper Data will be added and flagged in red for you to fix.</p>
            </div>

            <datalist id="ingredient-items-list">
              <option v-for="item in items" :key="item" :value="item"></option>
            </datalist>

            <!-- Ingredient Rows -->
            <div class="overflow-x-auto">
              <table class="w-full text-left bg-white border min-w-[500px]">
                <thead>
                  <tr class="bg-gray-100 border-b">
                    <th class="p-2 font-medium text-sm">Ingredient Name</th>
                    <th class="p-2 font-medium text-sm w-24">Qty</th>
                    <th class="p-2 font-medium text-sm w-40">U of M</th>
                    <th class="p-2 w-10"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="(ing, index) in ingredients" :key="index" class="border-b align-top">
                    <td class="p-2">
                      <input type="text" v-model="ing.name" @input="hasInteracted = true" list="ingredient-items-list"
                             class="w-full border p-1 rounded" :class="{'field-error': ingredientRowErrors[index].name}">
                      <p v-if="ingredientRowErrors[index].name" class="text-xs text-red-600 mt-1">Not in Helper Data</p>
                    </td>
                    <td class="p-2">
                      <input type="number" v-model="ing.qty" @input="hasInteracted = true"
                             class="w-full border p-1 rounded" :class="{'field-error': ingredientRowErrors[index].qty}">
                      <p v-if="ingredientRowErrors[index].qty" class="text-xs text-red-600 mt-1">Qty &gt; 0 required</p>
                    </td>
                    <td class="p-2">
                      <select v-model="ing.uom" @change="hasInteracted = true"
                              class="w-full border p-1 rounded" :class="{'field-error': ingredientRowErrors[index].uom}">
                        <option value=""></option>
                        <optgroup label="Weight"><option v-for="uom in uomData.Weight" :key="uom">{{ uom }}</option></optgroup>
                        <optgroup label="Volume"><option v-for="uom in uomData.Volume" :key="uom">{{ uom }}</option></optgroup>
                        <optgroup label="Each"><option v-for="uom in uomData.Each" :key="uom">{{ uom }}</option></optgroup>
                      </select>
                      <p v-if="ingredientRowErrors[index].uom" class="text-xs text-red-600 mt-1">Select a U of M</p>
                    </td>
                    <td class="p-2 text-center">
                      <button @click="removeIngredient(index)" class="text-red-500 hover:text-red-700 font-bold">✕</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <button @click="addIngredient" class="mt-4 text-blue-600 hover:text-blue-800 font-medium text-sm">+ Add Row</button>
            <p v-if="fieldError('ingredients')" class="text-xs text-red-600 mt-2">{{ fieldError('ingredients') }}</p>
          </div>
        </div>

        <!-- SECTION 5: INSTRUCTIONS -->
        <div class="mb-6">
          <div class="bg-teal-600 text-white px-4 py-2 rounded-t-lg font-bold">5. Instructions <span class="font-normal text-teal-100 text-sm">(Optional)</span></div>
          <div class="border border-teal-600 p-4 rounded-b-lg bg-teal-50">
            <p class="text-xs text-gray-500 mb-3">Drag the ⠿ handle to reorder steps.</p>
            <div
              v-for="(step, index) in instructions" :key="step.uid"
              draggable="true"
              @dragstart="onDragStart(index, $event)"
              @dragover.prevent="onDragOver(index)"
              @drop.prevent="onDrop(index)"
              @dragend="onDragEnd"
              class="flex items-start gap-2 mb-2 bg-white border rounded p-2"
              :class="{'opacity-40': draggingIndex === index, 'drag-over': dragOverIndex === index && draggingIndex !== index}"
            >
              <span class="cursor-move text-gray-400 mt-2 select-none" title="Drag to reorder">⠿</span>
              <span class="font-bold text-gray-500 mt-2 w-6 text-right shrink-0">{{ index + 1 }}.</span>
              <textarea v-model="step.text" @input="hasInteracted = true" rows="2"
                        class="flex-1 border rounded p-2 text-sm" placeholder="Describe this step..."></textarea>
              <button @click="removeInstruction(index)" class="text-red-500 hover:text-red-700 font-bold mt-2">✕</button>
            </div>

            <button @click="addInstruction" class="mt-2 text-blue-600 hover:text-blue-800 font-medium text-sm">+ Add Step</button>
          </div>
        </div>
      </div>
    </div>

    <!-- STICKY FOOTER: SAVE -->
    <div class="border-t bg-white p-4 sm:p-6 shadow-inner">
      <div class="max-w-5xl mx-auto">
        <p v-if="!isValid && hasInteracted" class="mb-3 text-sm text-red-600">Some fields need attention - see the warnings above.</p>
        <div v-if="serverMessage" class="mb-3 bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
          {{ serverMessage }}
        </div>
        <button @click="saveData" :disabled="isSaving || !isValid"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-lg shadow-md transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
          {{ isSaving ? 'Saving...' : '💾 Save Recipe to Database' }}
        </button>
      </div>
    </div>
  </template>
</div>

<script>
  const { createApp } = Vue

  createApp({
    data() {
      return {
        loadingHelperData: !window.__HELPER_DATA__,
        helperDataError: '',
        isSaving: false,
        showBulk: false,
        bulkText: '',
        hasInteracted: false,
        touched: {},
        equivTouched: { Weight: false, Volume: false, Each: false },
        serverErrors: {},
        serverMessage: '',
        uomData: { Weight: [], Volume: [], Each: [] },
        items: [],
        form: {
          name: '', measureType: '', yieldQty: '', yieldUom: '',
          portionSize: '', portionUom: '', inventoryYesNo: 'No', inventoryUom: '',
          weightQty: '', weightUom: '', volumeQty: '', volumeUom: '', eachQty: '', eachUom: ''
        },
        ingredients: [
          { name: '', qty: '', uom: '' }
        ],
        instructions: [
          { text: '', uid: 1 }
        ],
        nextInstructionUid: 2,
        draggingIndex: null,
        dragOverIndex: null
      }
    },
    computed: {
      availableYieldUoms() { return this.form.measureType ? this.uomData[this.form.measureType] : []; },
      allUoms() { return [].concat(this.uomData.Weight, this.uomData.Volume, this.uomData.Each); },
      portionCategory() { return this.getCategory(this.form.portionUom); },
      inventoryCategory() { return this.getCategory(this.form.inventoryUom); },
      // Categories (Weight/Volume/Each) that actually conflict with the recipe's base
      // Measure Type - i.e. the ones equivalency entry is required for.
      conflictCategories() {
        let cats = new Set();
        const base = this.form.measureType;
        if (!base) return cats;
        if (this.portionCategory && this.portionCategory !== base) cats.add(this.portionCategory);
        if (this.form.inventoryYesNo === 'Yes' && this.inventoryCategory && this.inventoryCategory !== base) {
          cats.add(this.inventoryCategory);
        }
        return cats;
      },
      needsEquivalency() { return this.form.measureType && this.conflictCategories.size > 0; },
      meaningfulIngredients() { return this.ingredients.filter(i => i.name && i.name.trim() !== ''); },
      meaningfulInstructions() { return this.instructions.filter(s => s.text && s.text.trim() !== ''); },
      ingredientRowErrors() {
        return this.ingredients.map(ing => {
          const started = ing.name && ing.name.trim() !== '';
          if (!started) return { name: false, qty: false, uom: false };
          return {
            name: !this.items.includes(ing.name.trim()),
            qty: !this.isPositiveNumber(ing.qty),
            uom: !this.allUoms.includes(ing.uom)
          };
        });
      },
      errors() {
        const e = {};
        const measureCategories = ['Weight', 'Volume', 'Each'];

        if (!this.form.name || !this.form.name.trim()) e.name = 'Recipe Name is required.';

        if (measureCategories.indexOf(this.form.measureType) === -1) e.measureType = 'Select a Measure Type.';

        if (!this.isPositiveNumber(this.form.yieldQty)) e.yieldQty = 'Yield Qty must be a number greater than 0.';

        if (this.form.measureType) {
          if (!this.form.yieldUom || this.uomData[this.form.measureType].indexOf(this.form.yieldUom) === -1) {
            e.yieldUom = 'Select a valid Yield U of M for ' + this.form.measureType + '.';
          }
        }

        if (this.form.portionUom && !this.portionCategory) e.portionUom = 'Unrecognized Portion U of M.';

        if (this.form.inventoryYesNo === 'Yes' && (!this.form.inventoryUom || !this.inventoryCategory)) {
          e.inventoryUom = 'Select a valid Inventory U of M.';
        }

        if (this.needsEquivalency) {
          if (this.conflictCategories.has('Weight') &&
              (!this.isPositiveNumber(this.form.weightQty) || this.uomData.Weight.indexOf(this.form.weightUom) === -1)) {
            e.weightEquivalency = 'Provide a valid Weight equivalency (Qty + U of M).';
          }
          if (this.conflictCategories.has('Volume') &&
              (!this.isPositiveNumber(this.form.volumeQty) || this.uomData.Volume.indexOf(this.form.volumeUom) === -1)) {
            e.volumeEquivalency = 'Provide a valid Volume equivalency (Qty + U of M).';
          }
          if (this.conflictCategories.has('Each') &&
              (!this.isPositiveNumber(this.form.eachQty) || this.uomData.Each.indexOf(this.form.eachUom) === -1)) {
            e.eachEquivalency = 'Provide a valid Each equivalency (Qty + U of M).';
          }
        }

        if (this.meaningfulIngredients.length === 0) {
          e.ingredients = 'Add at least one ingredient.';
        } else if (this.ingredientRowErrors.some(r => r.name || r.qty || r.uom)) {
          e.ingredients = 'Every ingredient needs a recognized name, a Qty > 0, and a valid U of M.';
        }

        return e;
      },
      isValid() { return Object.keys(this.errors).length === 0; }
    },
    watch: {
      'form.measureType'() { this.applyEquivDefaults(); },
      'form.yieldQty'() { this.applyEquivDefaults(); },
      'form.yieldUom'() { this.applyEquivDefaults(); },
      'form.portionUom'() { this.applyEquivDefaults(); },
      'form.inventoryUom'() { this.applyEquivDefaults(); },
      'form.inventoryYesNo'() { this.applyEquivDefaults(); }
    },
    mounted() {
      if (window.__HELPER_DATA__) {
        this.applyHelperData(window.__HELPER_DATA__);
      } else {
        // Fallback path only - normally Code.gs inlines Helper Data into the page
        // so this round trip never has to happen on the common path.
        this.loadHelperData();
      }
    },
    methods: {
      applyHelperData(data) {
        this.uomData = (data && data.uom) || { Weight: [], Volume: [], Each: [] };
        this.items = (data && data.items) || [];
        this.loadingHelperData = false;
      },
      loadHelperData() {
        this.loadingHelperData = true;
        this.helperDataError = '';
        google.script.run
          .withSuccessHandler((data) => this.applyHelperData(data))
          .withFailureHandler((error) => {
            this.helperDataError = 'Failed to load recipe data: ' + error.message;
            this.loadingHelperData = false;
          })
          .getHelperData();
      },
      getCategory(uom) {
        for (let cat in this.uomData) { if (this.uomData[cat].includes(uom)) return cat; }
        return null;
      },
      isPositiveNumber(value) {
        const num = Number(value);
        return value !== '' && value !== null && value !== undefined && !isNaN(num) && num > 0;
      },
      touch(field) {
        this.touched[field] = true;
        this.hasInteracted = true;
        if (this.serverErrors[field]) delete this.serverErrors[field];
      },
      fieldError(field) {
        if (this.serverErrors[field]) return this.serverErrors[field];
        return this.touched[field] ? this.errors[field] : '';
      },
      touchEquiv(category) {
        this.equivTouched[category] = true;
        this.touch(category.toLowerCase() + 'Equivalency');
      },
      // Prefills the three equivalency rows: the category matching the base Measure
      // Type gets the Yield qty/uom, the category matching a conflicting Portion or
      // Inventory U of M gets that U of M with qty 1. Never overwrites a row the user
      // has edited by hand (tracked in equivTouched).
      applyEquivDefaults() {
        if (!this.needsEquivalency) return;
        const base = this.form.measureType;
        /** @type {Object<string, string>} */
        const roles = {};
        roles[base] = 'base';
        if (this.portionCategory && this.portionCategory !== base) {
          roles[this.portionCategory] = 'portion';
        }
        if (this.form.inventoryYesNo === 'Yes' && this.inventoryCategory && this.inventoryCategory !== base &&
            !roles[this.inventoryCategory]) {
          roles[this.inventoryCategory] = 'inventory';
        }

        ['Weight', 'Volume', 'Each'].forEach((cat) => {
          if (this.equivTouched[cat]) return;
          const role = roles[cat];
          const qtyKey = cat.toLowerCase() + 'Qty';
          const uomKey = cat.toLowerCase() + 'Uom';
          if (role === 'base') {
            this.form[qtyKey] = this.form.yieldQty;
            this.form[uomKey] = this.form.yieldUom;
          } else if (role === 'portion') {
            this.form[qtyKey] = 1;
            this.form[uomKey] = this.form.portionUom;
          } else if (role === 'inventory') {
            this.form[qtyKey] = 1;
            this.form[uomKey] = this.form.inventoryUom;
          }
        });
      },
      addIngredient() {
        this.ingredients.push({ name: '', qty: '', uom: '' });
      },
      removeIngredient(index) {
        this.ingredients.splice(index, 1);
        if (this.ingredients.length === 0) this.addIngredient();
      },
      addInstruction() {
        this.instructions.push({ text: '', uid: this.nextInstructionUid++ });
      },
      removeInstruction(index) {
        this.instructions.splice(index, 1);
        if (this.instructions.length === 0) this.addInstruction();
      },
      onDragStart(index, evt) {
        this.draggingIndex = index;
        if (evt && evt.dataTransfer) {
          evt.dataTransfer.effectAllowed = 'move';
          evt.dataTransfer.setData('text/plain', String(index));
        }
      },
      onDragOver(index) {
        this.dragOverIndex = index;
      },
      onDrop(targetIndex) {
        if (this.draggingIndex === null || this.draggingIndex === targetIndex) {
          this.draggingIndex = null;
          this.dragOverIndex = null;
          return;
        }
        const moved = this.instructions.splice(this.draggingIndex, 1)[0];
        this.instructions.splice(targetIndex, 0, moved);
        this.draggingIndex = null;
        this.dragOverIndex = null;
      },
      onDragEnd() {
        this.draggingIndex = null;
        this.dragOverIndex = null;
      },
      parseBulkData() {
        if (!this.bulkText.trim()) return;
        const rows = this.bulkText.split('\n');

        if (this.ingredients.length === 1 && !this.ingredients[0].name) {
          this.ingredients = [];
        }

        rows.forEach(row => {
          const cols = row.split('\t');
          if (cols.length > 0 && cols[0].trim() !== '') {
            this.ingredients.push({
              name: cols[0] ? cols[0].trim() : '',
              qty: cols[1] ? cols[1].trim() : '',
              uom: cols[2] ? cols[2].trim() : ''
            });
          }
        });
        this.bulkText = '';
        this.showBulk = false;
        this.hasInteracted = true;
      },
      saveData() {
        // form{} doesn't cover every validated field - 'ingredients' lives outside
        // it, and the equivalency errors are keyed by category name, not by the
        // weightQty/weightUom-style form keys - so those need touching explicitly
        // or their warnings would never surface on a blocked Save attempt.
        Object.keys(this.form).forEach(k => this.touch(k));
        ['ingredients', 'weightEquivalency', 'volumeEquivalency', 'eachEquivalency'].forEach(k => this.touch(k));
        this.hasInteracted = true;
        if (!this.isValid) return;

        this.isSaving = true;
        this.serverMessage = '';
        this.serverErrors = {};

        const payload = {
          name: this.form.name.trim(),
          measureType: this.form.measureType,
          yieldQty: this.form.yieldQty,
          yieldUom: this.form.yieldUom,
          portionSize: this.form.portionSize,
          portionUom: this.form.portionUom,
          inventoryYesNo: this.form.inventoryYesNo,
          inventoryUom: this.form.inventoryUom,
          weightQty: this.form.weightQty,
          weightUom: this.form.weightUom,
          volumeQty: this.form.volumeQty,
          volumeUom: this.form.volumeUom,
          eachQty: this.form.eachQty,
          eachUom: this.form.eachUom,
          ingredients: this.meaningfulIngredients.map(i => ({ name: i.name.trim(), qty: i.qty, uom: i.uom })),
          instructions: this.meaningfulInstructions.map(s => ({ text: s.text.trim() }))
        };

        google.script.run
          .withSuccessHandler((res) => {
            this.isSaving = false;
            if (res && res.ok) {
              alert('Recipe Saved Successfully!');
              this.resetForm();
            } else {
              this.serverErrors = (res && res.errors) || {};
              this.serverMessage = (res && res.message) || 'Could not save the recipe.';
            }
          })
          .withFailureHandler((error) => {
            this.isSaving = false;
            this.serverMessage = 'Error saving recipe: ' + error.message;
          })
          .saveRecipeFromWeb(payload);
      },
      resetForm() {
        Object.keys(this.form).forEach(k => { this.form[k] = ''; });
        this.form.inventoryYesNo = 'No';
        this.ingredients = [{ name: '', qty: '', uom: '' }];
        this.instructions = [{ text: '', uid: this.nextInstructionUid++ }];
        this.touched = {};
        this.equivTouched = { Weight: false, Volume: false, Each: false };
        this.serverErrors = {};
        this.serverMessage = '';
        this.hasInteracted = false;
      }
    }
  }).mount('#app')
</script>
</body>
</html>
