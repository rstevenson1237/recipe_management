<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [data-title]:hover::after {
      content: attr(data-title);
      position: absolute;
      bottom: 100%;
      left: 0;
      background: #1e293b;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      width: max-content;
      max-width: 250px;
      z-index: 10;
      margin-bottom: 5px;
    }
    .tooltip-container { position: relative; display: inline-block; }
  </style>
</head>
<body class="bg-gray-100 p-6">

<div id="app" class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8 mb-20">
  <h1 class="text-3xl font-bold text-gray-800 mb-8 border-b pb-4">Create New Recipe</h1>

  <!-- SECTIONS 1-4 (Headers, Yield, Portion/Inventory, Accounting) remain identical -->
  <!-- SECTION 1 -->
  <div class="mb-6">
    <div class="bg-blue-600 text-white px-4 py-2 rounded-t-lg font-bold">1. Recipe Identification</div>
    <div class="border border-blue-600 p-4 rounded-b-lg grid grid-cols-2 gap-6 bg-blue-50">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="The name used to refer to the recipe for prep and menu use">Recipe Name ⓘ</label>
        <input type="text" v-model="form.name" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="Select Weight, Volume or Count. This determines the yield constraints.">Measure Type ⓘ</label>
        <select v-model="form.measureType" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
          <option value="" disabled>Select Type...</option>
          <option value="Weight">Weight</option>
          <option value="Volume">Volume</option>
          <option value="Count">Count</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SECTION 2 -->
  <div class="mb-6">
    <div class="bg-green-600 text-white px-4 py-2 rounded-t-lg font-bold">2. Yield Output</div>
    <div class="border border-green-600 p-4 rounded-b-lg grid grid-cols-2 gap-6 bg-green-50">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="The total yielded amount or number of servings the recipe produces.">Yield Qty ⓘ</label>
        <input type="number" v-model="form.yieldQty" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 tooltip-container" data-title="Constrained by Measure Type.">Yield U of M ⓘ</label>
        <select v-model="form.yieldUom" :disabled="!form.measureType" class="w-full border-gray-300 rounded-md shadow-sm p-2 border disabled:bg-gray-200">
          <option value="" disabled>Select Yield UOM...</option>
          <option v-for="uom in availableYieldUoms" :key="uom" :value="uom">{{ uom }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SECTION 3 -->
  <div class="mb-6">
    <div class="bg-purple-600 text-white px-4 py-2 rounded-t-lg font-bold">3. Portion & Usage</div>
    <div class="border border-purple-600 p-4 rounded-b-lg bg-purple-50">
      <div class="grid grid-cols-4 gap-4 mb-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Portion Size</label><input type="number" v-model="form.portionSize" class="w-full border-gray-300 rounded-md shadow-sm p-2 border"></div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Portion U of M</label>
          <select v-model="form.portionUom" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
            <option value=""></option>
            <optgroup label="Weight"><option v-for="uom in uomData.Weight">{{uom}}</option></optgroup>
            <optgroup label="Volume"><option v-for="uom in uomData.Volume">{{uom}}</option></optgroup>
            <optgroup label="Count"><option v-for="uom in uomData.Count">{{uom}}</option></optgroup>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">In Inventory?</label>
          <select v-model="form.inventoryYesNo" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
            <option value="Yes">Yes</option><option value="No">No</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Inventory U of M</label>
          <select v-model="form.inventoryUom" :disabled="form.inventoryYesNo === 'No'" class="w-full border-gray-300 rounded-md shadow-sm p-2 border disabled:bg-gray-200">
            <option value=""></option>
            <optgroup label="Weight"><option v-for="uom in uomData.Weight">{{uom}}</option></optgroup>
            <optgroup label="Volume"><option v-for="uom in uomData.Volume">{{uom}}</option></optgroup>
            <optgroup label="Count"><option v-for="uom in uomData.Count">{{uom}}</option></optgroup>
          </select>
        </div>
      </div>
      
      <!-- Equivalency Block -->
      <div v-if="needsEquivalency" class="bg-yellow-100 border-l-4 border-yellow-500 p-4 mt-4 rounded">
        <h3 class="font-bold text-yellow-800 mb-2">⚠️ Equivalency Required</h3>
        <p class="text-sm text-yellow-700 mb-4">Please define how the different measurement types convert to each other.</p>
        <div class="flex items-center space-x-4">
          <template v-if="requiredEquivCategories.includes('Weight')">
            <div class="flex space-x-2"><input type="number" v-model="form.weightQty" placeholder="Qty" class="w-20 p-2 border rounded"><select v-model="form.weightUom" class="p-2 border rounded"><option v-for="uom in uomData.Weight">{{uom}}</option></select></div>
          </template>
          <span v-if="requiredEquivCategories.length > 1" class="font-bold text-gray-500">=</span>
          <template v-if="requiredEquivCategories.includes('Volume')">
             <div class="flex space-x-2"><input type="number" v-model="form.volumeQty" placeholder="Qty" class="w-20 p-2 border rounded"><select v-model="form.volumeUom" class="p-2 border rounded"><option v-for="uom in uomData.Volume">{{uom}}</option></select></div>
          </template>
          <span v-if="requiredEquivCategories.includes('Count') && requiredEquivCategories.length > 1" class="font-bold text-gray-500">=</span>
          <template v-if="requiredEquivCategories.includes('Count')">
             <div class="flex space-x-2"><input type="number" v-model="form.eachQty" placeholder="Qty" class="w-20 p-2 border rounded"><select v-model="form.eachUom" class="p-2 border rounded"><option v-for="uom in uomData.Count">{{uom}}</option></select></div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION 4 -->
  <div class="mb-6">
    <div class="bg-gray-700 text-white px-4 py-2 rounded-t-lg font-bold">4. Accounting</div>
    <div class="border border-gray-700 p-4 rounded-b-lg grid grid-cols-3 gap-4 bg-gray-50">
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Cost Update Method</label><select v-model="form.costMethod" class="w-full border-gray-300 rounded-md p-2 border"><option value="Nightly">Nightly</option><option value="Manual">Manual</option></select></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Item Category 1</label><input type="text" v-model="form.cat1" class="w-full border-gray-300 rounded-md p-2 border"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Item Category 2</label><input type="text" v-model="form.cat2" class="w-full border-gray-300 rounded-md p-2 border"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Cost Account</label><input type="text" v-model="form.costAcct" class="w-full border-gray-300 rounded-md p-2 border"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Inventory Account</label><input type="text" v-model="form.invAcct" class="w-full border-gray-300 rounded-md p-2 border"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Waste Account</label><input type="text" v-model="form.wasteAcct" class="w-full border-gray-300 rounded-md p-2 border"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SECTION 5: INGREDIENTS & BULK PASTE        -->
  <!-- ========================================== -->
  <div class="mb-8">
    <div class="flex justify-between items-end bg-orange-600 text-white px-4 py-2 rounded-t-lg font-bold">
      <span>5. Ingredients List</span>
      <button @click="showBulk = !showBulk" class="text-xs bg-orange-800 hover:bg-orange-900 px-3 py-1 rounded">
        {{ showBulk ? 'Hide Bulk Paste' : 'Use Bulk Paste' }}
      </button>
    </div>
    <div class="border border-orange-600 p-4 rounded-b-lg bg-orange-50">
      
      <!-- Bulk Paste Tool -->
      <div v-if="showBulk" class="mb-6 bg-white p-4 border border-orange-300 rounded shadow-inner">
        <label class="block text-sm font-medium text-gray-700 mb-2">Bulk Paste from Excel (Ingredient | Qty | UOM | Yield %)</label>
        <textarea v-model="bulkText" rows="4" class="w-full border-gray-300 rounded-md shadow-sm p-2 border font-mono text-sm mb-2" placeholder="Paste your Excel grid here..."></textarea>
        <button @click="parseBulkData" class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700">Parse Data</button>
      </div>

      <!-- Ingredient Rows -->
      <table class="w-full text-left bg-white border">
        <thead>
          <tr class="bg-gray-100 border-b">
            <th class="p-2 font-medium text-sm">Ingredient Name</th>
            <th class="p-2 font-medium text-sm w-24">Qty</th>
            <th class="p-2 font-medium text-sm w-32">U of M</th>
            <th class="p-2 font-medium text-sm w-24">Yield %</th>
            <th class="p-2 w-10"></th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(ing, index) in ingredients" :key="index" class="border-b">
            <td class="p-2"><input type="text" v-model="ing.name" class="w-full border p-1 rounded"></td>
            <td class="p-2"><input type="number" v-model="ing.qty" class="w-full border p-1 rounded"></td>
            <td class="p-2"><input type="text" v-model="ing.uom" class="w-full border p-1 rounded"></td>
            <td class="p-2"><input type="number" v-model="ing.yieldPercent" class="w-full border p-1 rounded"></td>
            <td class="p-2 text-center">
              <button @click="removeIngredient(index)" class="text-red-500 hover:text-red-700 font-bold">✕</button>
            </td>
          </tr>
        </tbody>
      </table>
      
      <button @click="addIngredient" class="mt-4 text-blue-600 hover:text-blue-800 font-medium text-sm">+ Add Row</button>

    </div>
  </div>

  <button @click="saveData" :disabled="isSaving" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-lg shadow-md transition-colors disabled:bg-gray-400">
    {{ isSaving ? 'Saving...' : '💾 Save Recipe to Database' }}
  </button>

</div>

<script>
  const { createApp } = Vue

  createApp({
    data() {
      return {
        isSaving: false,
        showBulk: false,
        bulkText: '',
        uomData: {
          'Weight': ['GRM', 'OZ-wt', 'LB'],
          'Volume': ['ML', 'tsp', 'Tbsp', 'OZ-fl', 'Pint', 'Quart', 'Gallon', '1/2 gallon', 'Cup', 'Dash', 'Drop'],
          'Count': ['Each']
        },
        form: {
          name: '', measureType: '', yieldQty: '', yieldUom: '', 
          portionSize: '', portionUom: '', inventoryYesNo: 'No', inventoryUom: '',
          weightQty: '', weightUom: '', volumeQty: '', volumeUom: '', eachQty: '', eachUom: '',
          costMethod: 'Nightly', cat1: 'Food', cat2: '', costAcct: '', invAcct: '', wasteAcct: ''
        },
        ingredients: [
          { name: '', qty: '', uom: '', yieldPercent: '' }
        ]
      }
    },
    computed: {
      availableYieldUoms() { return this.form.measureType ? this.uomData[this.form.measureType] : []; },
      needsEquivalency() {
        if (!this.form.measureType) return false;
        const base = this.form.measureType;
        const pCat = this.getCategory(this.form.portionUom);
        const iCat = this.getCategory(this.form.inventoryUom);
        return (pCat && pCat !== base) || (this.form.inventoryYesNo === 'Yes' && iCat && iCat !== base);
      },
      requiredEquivCategories() {
        let cats = new Set();
        if (this.needsEquivalency) {
            cats.add(this.form.measureType);
            if (this.getCategory(this.form.portionUom)) cats.add(this.getCategory(this.form.portionUom));
            if (this.form.inventoryYesNo === 'Yes' && this.getCategory(this.form.inventoryUom)) cats.add(this.getCategory(this.form.inventoryUom));
        }
        return Array.from(cats);
      }
    },
    watch: {
      'form.measureType': function() { this.form.yieldUom = ''; }
    },
    methods: {
      getCategory(uom) {
        for (let cat in this.uomData) { if (this.uomData[cat].includes(uom)) return cat; }
        return null;
      },
      addIngredient() {
        this.ingredients.push({ name: '', qty: '', uom: '', yieldPercent: '' });
      },
      removeIngredient(index) {
        this.ingredients.splice(index, 1);
        if (this.ingredients.length === 0) this.addIngredient();
      },
      parseBulkData() {
        if (!this.bulkText.trim()) return;
        const rows = this.bulkText.split('\n');
        
        // Clear empty first row if untouched
        if (this.ingredients.length === 1 && !this.ingredients[0].name) {
          this.ingredients = [];
        }

        rows.forEach(row => {
          const cols = row.split('\t'); // Split by Excel Tab-spacing
          if (cols.length > 0 && cols[0].trim() !== '') {
            this.ingredients.push({
              name: cols[0] ? cols[0].trim() : '',
              qty: cols[1] ? cols[1].trim() : '',
              uom: cols[2] ? cols[2].trim() : '',
              yieldPercent: cols[3] ? cols[3].trim() : ''
            });
          }
        });
        this.bulkText = '';
        this.showBulk = false;
      },
      saveData() {
        if(!this.form.name) { alert("Recipe Name is required."); return; }
        
        this.isSaving = true;

        const headerData = [
          this.form.name, this.form.measureType, "GRM", this.form.yieldQty, this.form.yieldUom,
          this.form.weightQty, this.form.weightUom, this.form.volumeQty, this.form.volumeUom,
          this.form.eachQty, this.form.eachUom, this.form.portionSize, this.form.portionUom,
          this.form.inventoryYesNo, this.form.inventoryUom, this.form.costMethod,
          this.form.cat1, this.form.cat2, "", this.form.inventoryUom, 
          this.form.costAcct, this.form.invAcct, this.form.wasteAcct, "YES", ""
        ];
        
        const payload = {
          headerData: headerData,
          ingredients: this.ingredients
        };

        // Send to Apps Script
        google.script.run
          .withSuccessHandler(() => { 
             alert('Recipe Saved Successfully!'); 
             this.resetForm(); 
             this.isSaving = false;
          })
          .withFailureHandler((error) => {
             alert('Error saving recipe: ' + error.message);
             this.isSaving = false;
          })
          .saveRecipeFromWeb(payload);
      },
      resetForm() {
         Object.keys(this.form).forEach(k => this.form[k] = '');
         this.form.inventoryYesNo = 'No';
         this.form.costMethod = 'Nightly';
         this.ingredients = [{ name: '', qty: '', uom: '', yieldPercent: '' }];
      }
    }
  }).mount('#app')
</script>
</body>
</html>
